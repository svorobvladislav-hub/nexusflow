function findBestAnswer(q){

const qLower = q.toLowerCase();

}

}

let h=`<div class="glass"><div class="section-title">📂 Категория</div><select id="ycat" onchange="updateCatHelp()">`;
categories.forEach(c=>{h+=`<option value="${c.n}">${catName(c)}</option>`;});
h+=`</select><div class="help-box" id="catHelp">💡 ${lang==='ru'?'Выбери категорию':'Choose category'}</div></div>`;
h+=`<div class="glass"><div class="section-title">📋 Тема</div><input type="text" placeholder="${lang==='ru'?'Опиши тему...':'Describe topic...'}"></div>`;
h+=`<div class="glass"><div class="section-title">🎤 Голос</div><select id="voice" onchange="currentVoice=this.value">`;
voices.forEach(v=>{h+=`<option value="${v.n}" ${v.n===currentVoice?'selected':''}>${vName(v)}</option>`;});
h+=`</select></div>`;
h+=`<div class="glass"><div class="section-title">📹 Формат</div><div class="btn-row"><button class="btn btn-sm ${fmt==='h'?'btn-primary':'btn-outline'}" onclick="selectFmt('h')">📹 Гор</button><button class="btn btn-sm ${fmt==='s'?'btn-primary':'btn-outline'}" onclick="selectFmt('s')">📱 Верт</button><button class="btn btn-sm ${fmt==='b'?'btn-primary':'btn-outline'}" onclick="selectFmt('b')">🔄 Оба</button></div></div>`;
return h;
}

</div>
<p style="font-size:10px;color:var(--text2);margin-top:6px;">💡 ${lang==='ru'?'Спроси: Как создать видео? Сколько стоит VIP? Какие модели есть?':'Ask: How to create video? VIP price? What models?'}</p></div>`;

function sendChat(){
const input=document.getElementById('chatInput');
const msg=input.value.trim();
if(!msg)return;
const box=document.getElementById('chatBox');
box.innerHTML+=`<div class="chat-msg user">${msg}</div>`;
input.value='';
box.scrollTop=box.scrollHeight;
setTimeout(()=>{
const reply=findBestAnswer(msg);
box.innerHTML+=`<div class="chat-msg bot">${reply}</div>`;
box.scrollTop=box.scrollHeight;
},500);
}

function editFile(i){
const f=files[i];
const m=document.getElementById('modal');
m.style.display='flex';
m.innerHTML=`<div class="modal-content"><div class="section-title">✏️ ${f.n}</div><div class="editor-toolbar"><button onclick="saveFile(${i})">💾 Сохранить</button><button onclick="closeModal()">❌ Отмена</button></div><div class="code-editor" contenteditable="true">// ${f.n}</div></div>`;
}
function saveFile(i){closeModal();tg.showPopup({message:'✅ Сохранено!'});}
function closeModal(){document.getElementById('modal').style.display='none';}
function selectTab(t){tab=t;document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));const el=document.querySelector(`.tab[onclick*="${t}"]`);if(el)el.classList.add('active');R();}
function selectFmt(f){fmt=f;R();}
function setLang(l){lang=l;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));document.querySelector(`.lang-btn[onclick="setLang('${l}')"]`).classList.add('active');R();}
function buyItem(i){tg.openTelegramLink('https://t.me/'+telegramUser);}
function copyText(t){navigator.clipboard.writeText(t);tg.showPopup({message:'✅ Скопировано!'});}
function toggleHelper(){helperActive=!helperActive;document.getElementById('helperBtn').style.opacity=helperActive?'1':'0.3';}
function updateCatHelp(){
const cat=document.getElementById('ycat')?.value;
const c=categories.find(x=>x.n===cat);
if(c){
document.getElementById('catHelp').innerHTML='💡 '+(lang==='ru'?
`Музыка: ${c.music} | Озвучка: ${c.voice==='none'?'нет':c.voice}`:
`Music: ${c.music} | Voice: ${c.voice==='none'?'none':c.voice}`);
}
}

function generate(){
document.getElementById('progress').style.display='block';
const f=document.getElementById('progressFill'),l=document.getElementById('progressLabel');
let p=0;
const steps=lang==='ru'?['Подготовка','Сценарий','Поиск','Озвучка','Монтаж','Готово']:['Preparing','Script','Finding','Voice','Editing','Done'];
const int=setInterval(()=>{
p+=Math.floor(Math.random()*12)+5;
if(p>=100){p=100;clearInterval(int);l.textContent='✅ '+(lang==='ru'?'Готово!':'Done!');}
else{l.textContent=steps[Math.floor(p/20)]+' · '+p+'%';}
f.style.width=p+'%';
},600);
}

R();
</script>
