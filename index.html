<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NexusFlow</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #000000;
            --card: rgba(255,255,255,0.05);
            --accent: #0A84FF;
            --accent2: #5E5CE6;
            --gold: #FFD60A;
            --text: #FFFFFF;
            --text2: rgba(255,255,255,0.6);
            --border: rgba(255,255,255,0.1);
            --green: #30D158;
            --red: #FF453A;
            --orange: #FF9F0A;
            --glass: rgba(255,255,255,0.08);
            --blur: blur(20px);
            --editor-bg: #1a1a2e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .glow {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }
        .glow-1 { top: -100px; left: -100px; background: var(--accent); }
        .glow-2 { bottom: -100px; right: -100px; background: var(--accent2); }

        .container {
            position: relative;
            z-index: 1;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        .header {
            text-align: center;
            padding: 30px 0 20px;
        }
        .header .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 8px 32px rgba(10, 132, 255, 0.3);
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .header .subtitle {
            color: var(--text2);
            font-size: 14px;
            margin-top: 4px;
            letter-spacing: 0.2px;
        }

        .glass {
            background: var(--glass);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }
        .glass:active {
            transform: scale(0.98);
        }

        .profile-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--glass);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--border);
            border-radius: 20px;
            margin-bottom: 16px;
        }
        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .profile-info { flex: 1; min-width: 0; }
        .profile-name { font-weight: 600; font-size: 16px; letter-spacing: -0.3px; }
        .profile-status { font-size: 12px; color: var(--text2); }
        .token-badge {
            background: linear-gradient(135deg, rgba(255, 214, 10, 0.2), rgba(255, 214, 10, 0.1));
            border: 1px solid rgba(255, 214, 10, 0.3);
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            color: var(--gold);
            flex-shrink: 0;
            backdrop-filter: var(--blur);
        }

        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding: 4px 0;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .tabs::-webkit-scrollbar { display: none; }

        .tab {
            flex-shrink: 0;
            padding: 10px 14px;
            border-radius: 30px;
            border: 1px solid var(--border);
            background: var(--glass);
            backdrop-filter: var(--blur);
            color: var(--text2);
            text-align: center;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s ease;
            white-space: nowrap;
            letter-spacing: -0.2px;
        }
        .tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(10, 132, 255, 0.3);
        }
        .tab.vip {
            border-color: rgba(255, 214, 10, 0.4);
            color: var(--gold);
        }
        .tab.vip.active {
            background: var(--gold);
            border-color: var(--gold);
            color: #000;
            box-shadow: 0 4px 12px rgba(255, 214, 10, 0.3);
        }
        .tab.dev {
            border-color: rgba(255, 69, 58, 0.4);
            color: var(--red);
        }
        .tab.dev.active {
            background: var(--red);
            border-color: var(--red);
            color: #fff;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            padding-left: 4px;
        }

        select, input, textarea {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            font-size: 15px;
            outline: none;
            font-family: inherit;
            letter-spacing: -0.2px;
            -webkit-appearance: none;
        }
        textarea { min-height: 80px; resize: vertical; }
        select:focus, input:focus, textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.15);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            color: #fff;
            letter-spacing: -0.3px;
            transition: all 0.2s ease;
        }
        .btn-primary { background: linear-gradient(135deg, var(--accent), #0077ED); box-shadow: 0 4px 16px rgba(10, 132, 255, 0.3); }
        .btn-gold { background: linear-gradient(135deg, #FFD60A, #FFC700); color: #000; box-shadow: 0 4px 16px rgba(255, 214, 10, 0.3); }
        .btn-red { background: linear-gradient(135deg, var(--red), #dc2626); }
        .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.4; }

        .btn-sm { width: auto; padding: 10px 16px; font-size: 13px; border-radius: 12px; }
        .btn-xs { width: auto; padding: 8px 12px; font-size: 11px; border-radius: 8px; }
        .btn-row { display: flex; gap: 8px; }
        .btn-row .btn { flex: 1; }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.3px;

        .badge-vip { background: var(--gold); color: #000; }
        .badge-dev { background: var(--red); color: #fff; }
        .badge-free { background: var(--glass); color: var(--text2); }

        .model-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .model-item {
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--glass);
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .model-item.selected { border-color: var(--accent); background: rgba(10, 132, 255, 0.15); }
        .model-item .model-name { font-weight: 600; margin-top: 2px; }
        .model-item .model-dur { font-size: 10px; color: var(--text2); }

        .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 4px;
        }
        .dot-green { background: var(--green); box-shadow: 0 0 6px rgba(48, 209, 88, 0.5); }
        .dot-yellow { background: var(--orange); box-shadow: 0 0 6px rgba(255, 159, 10, 0.5); }
        .dot-red { background: var(--red); box-shadow: 0 0 6px rgba(255, 69, 58, 0.5); }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .stat-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
        }
        .stat-value { font-size: 28px; font-weight: 700; letter-spacing: -1px; }
        .stat-value.accent { color: var(--accent); }
        .stat-value.gold { color: var(--gold); }
        .stat-label { font-size: 11px; color: var(--text2); margin-top: 2px; }

        .ref-link {
            background: var(--glass);
            border: 1px dashed rgba(10, 132, 255, 0.4);
            border-radius: 14px;
            padding: 14px;
            text-align: center;
            font-size: 12px;
            color: var(--accent);
            word-break: break-all;
            margin: 8px 0;
            user-select: all;
        }

        .chat-box {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px;
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 8px;
        }
        .chat-msg {
            padding: 10px 14px;
            border-radius: 14px;
            margin: 6px 0;
            font-size: 13px;
            max-width: 85%;
            letter-spacing: -0.2px;
            line-height: 1.4;
        }
        .chat-msg.user {
            background: var(--accent);
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .chat-msg.bot {
            background: var(--glass);
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }

        .lang-switch { display: flex; justify-content: center; gap: 6px; margin-bottom: 16px; }
        .lang-btn {
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid var(--border);
            background: var(--glass);
            color: var(--text2);
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
        }
        .lang-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

        .progress-track {
            height: 4px;
            border-radius: 2px;
            background: var(--border);
            overflow: hidden;
            margin: 8px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            border-radius: 2px;
            transition: width 0.5s ease;
        }

        .price-table { width: 100%; border-collapse: collapse; margin: 8px 0; }
        .price-table th, .price-table td {
            padding: 10px 8px;
            text-align: left;
            font-size: 12px;
            border-bottom: 1px solid var(--border);
        }
        .price-table th { color: var(--text2); font-weight: 500; }

        .card-info {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            text-align: center;
            font-size: 18px;
            letter-spacing: 2px;
            font-weight: 600;
            margin: 8px 0;
            user-select: all;
        }

        .copy-btn { background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 12px; width: 100%; }

        .help-box {
            background: rgba(10, 132, 255, 0.1);
            border: 1px solid rgba(10, 132, 255, 0.2);
            border-radius: 12px;
            padding: 12px;
            margin-top: 8px;
            font-size: 12px;
            color: var(--accent);
        }

        .lock-screen { text-align: center; padding: 30px 20px; }
        .lock-screen .lock-icon { font-size: 60px; margin-bottom: 16px; }
        .lock-screen .lock-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .lock-screen .lock-desc { font-size: 13px; color: var(--text2); margin-bottom: 20px; }
        .lock-screen .lock-error { font-size: 11px; color: var(--red); margin-top: 6px; min-height: 16px; }

        .file-list-item { display: flex; align-items: center; gap: 8px; padding: 10px; border-bottom: 1px solid var(--border); cursor: pointer; }
        .file-list-item:hover { background: var(--glass); }
        .file-list-item .file-icon { font-size: 18px; }
        .file-list-item .file-name { flex: 1; font-size: 13px; }
        .file-list-item .file-size { font-size: 10px; color: var(--text2); }
        .file-list-item .file-actions { display: flex; gap: 4px; }
        .file-list-item .file-actions button { padding: 4px 8px; border-radius: 6px; border: none; cursor: pointer; font-size: 10px; }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .editor-toolbar { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
        .editor-toolbar button {
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--glass);
            color: var(--text2);
            cursor: pointer;
            font-size: 10px;
        }
        .editor-toolbar button:hover { background: var(--accent); color: #fff; }

        .code-editor {
            background: var(--editor-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            font-family: 'SF Mono', monospace;
            font-size: 11px;
            line-height: 1.6;
            color: #e2e8f0;
            min-height: 200px;
            resize: vertical;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .code-editor:focus { outline: none; border-color: var(--accent); }

        .generate-btn-container { padding: 0 0 20px 0; }

        .extend-bar { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
        .extend-bar .extend-count { background: var(--glass); padding: 6px 12px; border-radius: 20px; font-size: 12px; color: var(--text2); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .generating { animation: pulse 1.5s infinite; }
    </style>
</head>

function findBestAnswer(q) {
    const kb = knowledgeBase[currentLang] || knowledgeBase['ru'];
    for (const [key, val] of Object.entries(kb)) {
        if (q.toLowerCase().includes(key)) return val;
    }
    return kb['default'];
}

const genTabs = ['youtube', 'photo', 'audio', 'video'];

function R() { render(); }
function render() {
    let c = document.getElementById('content'), h = '';
    if (currentTab === 'youtube') h = youtubeTab();
    if (currentTab === 'photo') h = photoTab();
    if (currentTab === 'audio') h = audioTab();
    if (currentTab === 'video') h = videoTab();
    if (currentTab === 'buy') h = buyTab();
    if (currentTab === 'ref') h = refTab();
    if (currentTab === 'learn') h = learnTab();
    if (currentTab === 'support') h = supportTab();
    if (currentTab === 'dev') h = devTab();
    c.innerHTML = h;

    document.getElementById('generateBtnContainer').style.display = genTabs.includes(currentTab) ? 'block' : 'none';
    document.getElementById('progress').style.display = 'none';

    const unlockBtn = document.getElementById('devUnlockBtn');
    if (unlockBtn) {
        unlockBtn.onclick = function() {
            const keyInput = document.getElementById('devKeyInput');
            const errEl = document.getElementById('devError');
            if (!keyInput) return;
            const key = keyInput.value.trim();
            if (!key) { if (errEl) errEl.textContent = '❌ Введи ключ!'; return; }
            if (DEV_KEYS.includes(key)) { devMode = true; if (errEl) errEl.textContent = ''; R(); }
            else { if (errEl) errEl.textContent = '❌ Неверный ключ'; keyInput.value = ''; }
        };
    }
}

function catName(c) { return c[currentLang] || c['en']; }

    h += `<div class="glass"><div class="section-title">🎤 Голос</div><select id="voice" onchange="currentVoice=this.value">`;
    voices.forEach(v => { h += `<option value="${v.n}">${vName(v)}</option>`; });

    h += `<div class="glass"><div class="section-title">📹 Формат</div><div class="btn-row"><button class="btn btn-sm ${selectedFormat==='h'?'btn-primary':'btn-outline'}" onclick="selectFmt('h')">📹 Гор</button><button class="btn btn-sm ${selectedFormat==='s'?'btn-primary':'btn-outline'}" onclick="selectFmt('s')">📱 Верт</button><button class="btn btn-sm ${selectedFormat==='b'?'btn-primary':'btn-outline'}" onclick="selectFmt('b')">🔄 Оба</button></div></div>`;
    return h;
}

function supportTab() {
    return `<div class="glass"><div class="section-title">💬 AI-помощник</div>
    <div class="chat-box" id="chatBox"><div class="chat-msg bot">👋 Привет! Спроси меня!</div></div>
    <div style="display:flex;gap:6px;"><input type="text" id="chatInput" placeholder="Вопрос..." style="flex:1;" onkeypress="if(event.key==='Enter')sendChat()"><button class="btn btn-primary btn-sm" onclick="sendChat()">➤</button></div></div>`;
}

function sendChat() {
    const input = document.getElementById('chatInput');
    const msg = input.value.trim();
    if (!msg) return;
    const box = document.getElementById('chatBox');
    box.innerHTML += `<div class="chat-msg user">${msg}</div>`;
    input.value = '';
    box.scrollTop = box.scrollHeight;
    setTimeout(() => { box.innerHTML += `<div class="chat-msg bot">${findBestAnswer(msg)}</div>`; box.scrollTop = box.scrollHeight; }, 500);
}

function devTab() {
    let h = `<div class="glass"><div class="section-title">🛠️ Dev-панель</div>`;
    if (!devMode) {
        h += `<div class="lock-screen"><div class="lock-icon">🔒</div><div class="lock-title">Доступ ограничен</div><div class="lock-desc">Введи ключ разработчика</div>

function editFile(i) {
    const f = files[i]; const m = document.getElementById('modal'); m.style.display = 'flex';
    m.innerHTML = `<div class="modal-content"><div class="section-title">✏️ ${f.n}</div><div class="editor-toolbar"><button onclick="saveFile(${i})">💾 Сохранить</button><button onclick="closeModal()">❌ Отмена</button></div><div class="code-editor" contenteditable="true">// ${f.n}</div></div>`;
}
function saveFile(i) { closeModal(); alert('Сохранено!'); }
function closeModal() { document.getElementById('modal').style.display = 'none'; }
function selectTab(t) { currentTab = t; videoExtensions = 0; document.querySelectorAll('.tab').forEach(el => el.classList.remove('active')); const el = document.querySelector(`.tab[onclick*="${t}"]`); if (el) el.classList.add('active'); R(); }
function selectFmt(f) { selectedFormat = f; R(); }
function setLang(l) { currentLang = l; document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active')); document.querySelector(`.lang-btn[onclick="setLang('${l}')"]`).classList.add('active'); R(); }
function buyItem(i) { tg.openTelegramLink('https://t.me/' + telegramUser); }
function copyText(t) { navigator.clipboard.writeText(t); alert('Скопировано!'); }
function updateCatHelp() {
    const cat = document.getElementById('ycat')?.value;
    const c = categories.find(x => x.n === cat);
    if (c) { document.getElementById('catHelp').innerHTML = `💡 Музыка: ${c.music} | Озвучка: ${c.voice==='none'?'нет':c.voice}`; }
}

function generate() {
    var topic = 'BMW M5 drift';
    var cat = 'drift';
    
    var topicInput = document.querySelector('input[type="text"]');
    if (topicInput && topicInput.value) topic = topicInput.value;
    
    var catSelect = document.getElementById('ycat');
    if (catSelect && catSelect.value) cat = catSelect.value;
    
    var payload = {
        action: 'generate',
        topic: topic,
        category: cat,
        format: selectedFormat || 'b',
        lang: currentLang || 'ru',
        tab: currentTab || 'youtube'
    };
    
    document.getElementById('progress').style.display = 'block';
    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('progressLabel').textContent = 'Отправка...';
    
    try {
        tg.sendData(JSON.stringify(payload));
        document.getElementById('progressLabel').textContent = '✅ Отправлено! Жди в чате.';
    } catch(e) {
        document.getElementById('progressLabel').textContent = 'Ошибка: ' + e.message;
    }
}

R();
