<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NexusFlow</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #000000; --card: rgba(255,255,255,0.05); --accent: #0A84FF;
            --accent2: #5E5CE6; --gold: #FFD60A; --text: #FFFFFF;
            --text2: rgba(255,255,255,0.6); --border: rgba(255,255,255,0.1);

        * { margin:0; padding:0; box-sizing:border-box; }
        body {

            overflow-x: hidden; -webkit-font-smoothing: antialiased;
        }
        .glow { position:fixed; width:300px; height:300px; border-radius:50%; filter:blur(100px); opacity:0.3; pointer-events:none; z-index:0; }
        .glow-1 { top:-100px; left:-100px; background:var(--accent); }
        .glow-2 { bottom:-100px; right:-100px; background:var(--accent2); }
        .container { position:relative; z-index:1; max-width:500px; margin:0 auto; padding:20px 16px 40px; }
        .header { text-align:center; padding:30px 0 20px; }
        .logo { width:80px; height:80px; margin:0 auto 16px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border-radius:22px; display:flex; align-items:center; justify-content:center; font-size:36px; box-shadow:0 8px 32px rgba(10,132,255,0.3); }
        .header h1 { font-size:28px; font-weight:700; }
        .subtitle { color:var(--text2); font-size:14px; margin-top:4px; }
        .glass { background:var(--glass); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); border:1px solid var(--border); border-radius:20px; padding:16px; margin-bottom:12px; animation:slideUp 0.3s ease; }
        .profile-bar { display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--glass); backdrop-filter:var(--blur); border:1px solid var(--border); border-radius:20px; margin-bottom:16px; }
        .avatar { width:44px; height:44px; border-radius:16px; background:linear-gradient(135deg,var(--accent),var(--accent2)); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
        .profile-info { flex:1; } .profile-name { font-weight:600; font-size:16px; } .profile-status { font-size:12px; color:var(--text2); }
        .token-badge { background:linear-gradient(135deg,rgba(255,214,10,0.2),rgba(255,214,10,0.1)); border:1px solid rgba(255,214,10,0.3); padding:8px 14px; border-radius:30px; font-size:14px; font-weight:700; color:var(--gold); }
        .tabs { display:flex; gap:6px; margin-bottom:16px; overflow-x:auto; padding:4px 0; scrollbar-width:none; }
        .tabs::-webkit-scrollbar { display:none; }
        .tab { flex-shrink:0; padding:10px 14px; border-radius:30px; border:1px solid var(--border); background:var(--glass); color:var(--text2); cursor:pointer; font-size:12px; font-weight:500; white-space:nowrap; transition:all 0.2s; }
        .tab.active { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
        .tab.vip { border-color:rgba(255,214,10,0.4); color:var(--gold); } .tab.vip.active { background:var(--gold); border-color:var(--gold); color:#000; }
        .tab.dev { border-color:rgba(255,69,58,0.4); color:var(--red); } .tab.dev.active { background:var(--red); border-color:var(--red); color:#fff; }
        .section-title { font-size:13px; font-weight:600; color:var(--text2); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
        select, input, textarea { width:100%; padding:14px 16px; border-radius:14px; border:1px solid var(--border); background:rgba(255,255,255,0.05); color:var(--text); font-size:15px; outline:none; font-family:inherit; -webkit-appearance:none; }
        textarea { min-height:80px; resize:vertical; }
        .btn { width:100%; padding:16px; border-radius:16px; border:none; font-size:16px; font-weight:600; cursor:pointer; color:#fff; transition:all 0.2s; }
        .btn-primary { background:linear-gradient(135deg,var(--accent),#0077ED); }
        .btn-gold { background:linear-gradient(135deg,#FFD60A,#FFC700); color:#000; }
        .btn-red { background:linear-gradient(135deg,var(--red),#dc2626); }
        .btn-outline { background:transparent; border:1px solid var(--accent); color:var(--accent); }
        .btn:active { transform:scale(0.97); }
        .btn-sm { width:auto; padding:10px 16px; font-size:13px; border-radius:12px; }
        .btn-xs { width:auto; padding:8px 12px; font-size:11px; border-radius:8px; }
        .btn-row { display:flex; gap:8px; } .btn-row .btn { flex:1; }
        .badge { display:inline-block; padding:4px 10px; border-radius:20px; font-size:10px; font-weight:700; }
        .badge-vip { background:var(--gold); color:#000; } .badge-dev { background:var(--red); color:#fff; } .badge-free { background:var(--glass); color:var(--text2); }
        .model-list { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
        .model-item { padding:10px; border-radius:12px; border:1px solid var(--border); background:var(--glass); font-size:11px; cursor:pointer; text-align:center; }
        .dot { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:4px; }
        .dot-green { background:var(--green); } .dot-yellow { background:var(--orange); } .dot-red { background:var(--red); }
        .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
        .stat-card { background:var(--glass); border:1px solid var(--border); border-radius:16px; padding:16px; text-align:center; }
        .stat-value { font-size:28px; font-weight:700; } .stat-accent { color:var(--accent); } .stat-gold { color:var(--gold); }
        .stat-label { font-size:11px; color:var(--text2); margin-top:2px; }
        .ref-link { background:var(--glass); border:1px dashed rgba(10,132,255,0.4); border-radius:14px; padding:14px; text-align:center; font-size:12px; color:var(--accent); word-break:break-all; margin:8px 0; user-select:all; }
        .chat-box { background:var(--glass); border:1px solid var(--border); border-radius:16px; padding:12px; max-height:250px; overflow-y:auto; margin-bottom:8px; }
        .chat-msg { padding:10px 14px; border-radius:14px; margin:6px 0; font-size:13px; max-width:85%; }
        .chat-msg.user { background:var(--accent); margin-left:auto; } .chat-msg.bot { background:var(--glass); margin-right:auto; }
        .lang-switch { display:flex; justify-content:center; gap:6px; margin-bottom:16px; }
        .lang-btn { padding:8px 16px; border-radius:30px; border:1px solid var(--border); background:var(--glass); color:var(--text2); cursor:pointer; font-size:12px; font-weight:500; }
        .lang-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
        .progress-track { height:4px; border-radius:2px; background:var(--border); overflow:hidden; margin:8px 0; }
        .progress-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:2px; transition:width 0.5s; }
        .price-table { width:100%; border-collapse:collapse; margin:8px 0; }
        .price-table th, .price-table td { padding:10px 8px; text-align:left; font-size:12px; border-bottom:1px solid var(--border); }
        .card-info { background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:14px; padding:14px; text-align:center; font-size:18px; letter-spacing:2px; font-weight:600; margin:8px 0; user-select:all; }
        .copy-btn { background:var(--accent); color:#fff; border:none; padding:8px 16px; border-radius:10px; cursor:pointer; font-size:12px; width:100%; }
        .help-box { background:rgba(10,132,255,0.1); border:1px solid rgba(10,132,255,0.2); border-radius:12px; padding:12px; margin-top:8px; font-size:12px; color:var(--accent); }
        .lock-screen { text-align:center; padding:30px 20px; }
        .lock-screen .lock-icon { font-size:60px; margin-bottom:16px; }
        .lock-screen .lock-title { font-size:18px; font-weight:700; margin-bottom:8px; }
        .lock-screen .lock-desc { font-size:13px; color:var(--text2); margin-bottom:20px; }
        .file-list-item { display:flex; align-items:center; gap:8px; padding:10px; border-bottom:1px solid var(--border); }
        .file-list-item .file-icon { font-size:18px; } .file-list-item .file-name { flex:1; font-size:13px; } .file-list-item .file-size { font-size:10px; color:var(--text2); }
        .modal { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.8); z-index:100; display:flex; align-items:center; justify-content:center; }
        .modal-content { background:var(--bg); border:1px solid var(--border); border-radius:20px; padding:20px; width:90%; max-width:500px; max-height:80vh; overflow-y:auto; }
        .editor-toolbar { display:flex; gap:4px; margin-bottom:8px; flex-wrap:wrap; }
        .editor-toolbar button { padding:6px 10px; border-radius:8px; border:1px solid var(--border); background:var(--glass); color:var(--text2); cursor:pointer; font-size:10px; }
        .code-editor { background:var(--editor-bg); border:1px solid var(--border); border-radius:12px; padding:12px; font-family:'SF Mono',monospace; font-size:11px; line-height:1.6; color:#e2e8f0; min-height:200px; resize:vertical; overflow:auto; }
        .generate-btn-container { padding: 0 0 20px 0; }
        .extend-bar { display:flex; gap:6px; align-items:center; margin-top:8px; }
        .extend-bar .extend-count { background:var(--glass); padding:6px 12px; border-radius:20px; font-size:12px; color:var(--text2); }
        @keyframes slideUp { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
        .generating { animation:pulse 1.5s infinite; }
    </style>
</head>
<body>
<div class="glow glow-1"></div><div class="glow glow-2"></div>
<div class="container">

function R(){render();}
function render(){

return`<div class="glass"><div class="section-title">💬 AI-помощник</div>

}

function sendChat(){
const input=document.getElementById('chatInput');const msg=input.value.trim();if(!msg)return;
const box=document.getElementById('chatBox');box.innerHTML+=`<div class="chat-msg user">${msg}</div>`;input.value='';box.scrollTop=box.scrollHeight;
setTimeout(()=>{box.innerHTML+=`<div class="chat-msg bot">${findBestAnswer(msg)}</div>`;box.scrollTop=box.scrollHeight;},500);
}

function devTab(){
let h=`<div class="glass"><div class="section-title">🛠️ Dev-панель</div>`;
if(!devMode){
h+=`<div class="lock-screen"><div class="lock-icon">🔒</div>

function checkDevKey(){
const keyInput = document.getElementById('devKeyInput');
if (!keyInput) { alert('Ошибка: поле ввода не найдено'); return; }
const key = keyInput.value.trim();
if (!key) { alert('❌ Введи ключ!'); return; }
if (DEV_KEYS.includes(key)) {
devMode = true;
alert('✅ Доступ разрешён!');
R();
} else {
alert('❌ Неверный ключ: ' + key);
}
}

function editFile(i){
const f=files[i];const m=document.getElementById('modal');m.style.display='flex';
m.innerHTML=`<div class="modal-content"><div class="section-title">✏️ ${f.n}</div><div class="editor-toolbar"><button onclick="saveFile(${i})">💾 Сохранить</button><button onclick="closeModal()">❌ Отмена</button></div><div class="code-editor" contenteditable="true">// ${f.n}</div></div>`;
}
function saveFile(i){closeModal();tg.showPopup({message:'✅ Сохранено!'});}
function closeModal(){document.getElementById('modal').style.display='none';}
function selectTab(t){tab=t;videoExtensions=0;document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));const el=document.querySelector(`.tab[onclick*="${t}"]`);if(el)el.classList.add('active');R();}
function selectFmt(f){fmt=f;R();}
function setLang(l){lang=l;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));document.querySelector(`.lang-btn[onclick="setLang('${l}')"]`).classList.add('active');R();}
function buyItem(i){tg.openTelegramLink('https://t.me/'+telegramUser);}
function copyText(t){navigator.clipboard.writeText(t);tg.showPopup({message:'✅ Скопировано!'});}
function updateCatHelp(){
const cat=document.getElementById('ycat')?.value;const c=categories.find(x=>x.n===cat);
if(c){document.getElementById('catHelp').innerHTML='💡 '+(lang==='ru'?`Музыка: ${c.music} | Озвучка: ${c.voice==='none'?'нет':c.voice}`:`Music: ${c.music} | Voice: ${c.voice==='none'?'none':c.voice}`);}
}

function generate(){
document.getElementById('progress').style.display='block';
const f=document.getElementById('progressFill'),l=document.getElementById('progressLabel');let p=0;
const steps=lang==='ru'?['Подготовка','Сценарий','Поиск','Озвучка','Монтаж','Готово']:['Preparing','Script','Finding','Voice','Editing','Done'];
const int=setInterval(()=>{p+=Math.floor(Math.random()*12)+5;if(p>=100){p=100;clearInterval(int);l.textContent='✅ '+(lang==='ru'?'Готово!':'Done!');}else{l.textContent=steps[Math.floor(p/20)]+' · '+p+'%';}f.style.width=p+'%';},600);
}

R();
</script>
